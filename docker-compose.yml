# docker-compose.dev.yml (Solo para desarrollo rápido)
version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: dev_postgres
    environment:
      POSTGRES_DB: db_incidencias
      POSTGRES_USER: usuario_app
      POSTGRES_PASSWORD: password_seguro
    ports:
      - "5432:5432"